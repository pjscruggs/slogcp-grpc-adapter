name: Verify PR53 Historical Cloud Evidence

on:
  push:
    branches: [feat/v2-major-release]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Module E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact bootstrap candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify reviewed verifier and test contents
        run: |
          sha256sum --check <<'DIGESTS'
          2c6b48258081cc994972fda71bb16e12c8f613717db45e039b28d413e5075ec5  .github/scripts/verify_existing_e2e.py
          3ce1f3d5831b32833e30d9551500c6fa76379dfbd1aa7bde21e4b9873f2bfbac  .github/scripts/test_verify_existing_e2e.py
          DIGESTS

      - name: Test historical evidence rejection
        run: python -B -m unittest discover -s .github/scripts -p test_verify_existing_e2e.py -v

      - name: Verify historical cloud proof and current candidate authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/verify_existing_e2e.py
